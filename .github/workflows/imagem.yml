# Constrói a imagem bmos sobre o Bazzite e publica no registro de pacotes do GitHub.
# Roda a cada mudança no tema e uma vez por dia, para acompanhar as atualizações do Bazzite.
name: Imagem bmos

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Uma imagem para cada base do Bazzite, conforme a placa de vídeo.
          # AMD e Intel.
          - base: bazzite
            nome: bmtheme
          # NVIDIA GTX das séries 900 e 1000 (driver 580).
          - base: bazzite-nvidia
            nome: bmtheme-nvidia
          # NVIDIA RTX e GTX 1600 (driver com os módulos abertos).
          - base: bazzite-nvidia-open
            nome: bmtheme-nvidia-open
          # AMD e Intel, ligando direto no modo jogo da Steam, como o Steam Deck.
          - base: bazzite-deck
            nome: bmtheme-deck
    steps:
      - uses: actions/checkout@v4

      # A imagem do Bazzite tem vários GB: sem esta faxina, falta disco na máquina do GitHub.
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache \
                      /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Construir
        id: construir
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ matrix.nome }}
          tags: latest
          context: .
          containerfiles: imagem/Containerfile
          layers: false
          build-args: BASE=ghcr.io/ublue-os/${{ matrix.base }}:stable
          oci: false

      - name: Publicar
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.construir.outputs.image }}
          tags: ${{ steps.construir.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
