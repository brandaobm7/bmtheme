# Nomes dos apps no bmos. Os apps do KDE e do Bazzite têm nome de marca
# (Gwenview, Haruna, Ark); aqui cada um ganha um nome que diz o que ele faz.
#
#   arquivo do app = nome que aparece
#
# Vale na grade de apps, na busca, na barra superior, na dock e nos menus do
# Plasma. Dentro do próprio app (título da janela, tela "Sobre") o nome original
# continua. O nome original segue valendo na busca.
# Um "-" no lugar do nome tira o app da grade do bmos, sem desinstalar.
# Quem aplica é o comando bmos-nomes, no login e na instalação do tema.

org.kde.gwenview.desktop = Fotos
org.kde.haruna.desktop = Mídia
org.kde.kwrite.desktop = Editor de Texto
org.kde.konsole.desktop = Terminal
org.gnome.Ptyxis.desktop = Terminal
org.kde.spectacle.desktop = Captura de Tela
org.kde.ark.desktop = Compactador
org.kde.kcalc.desktop = Calculadora
org.kde.filelight.desktop = Uso do Disco
io.github.kolunmi.Bazaar.desktop = Loja de Apps
io.github.rfrench3.bazzite-updater.desktop = Atualizações

# O Arquivos é o gerenciador de pastas do bmos. O Dolphin fica de reserva.
org.kde.dolphin.desktop = -
